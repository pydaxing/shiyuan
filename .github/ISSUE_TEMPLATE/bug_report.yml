name: 使用问题
description: 描述你在食愿小灶或开发过程中遇到的问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。公开 Issue 请勿包含家庭邀请码、微信个人资料、云端凭据或真实家庭数据导出。
  - type: dropdown
    id: area
    attributes:
      label: 出现问题的位置
      options:
        - 微信小程序
        - 本地开发或构建
        - 项目文档
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与实际表现
      description: 从哪个页面开始，做了什么，最后发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 手机系统、微信版本；开发问题请补充 Node.js、开发者工具与源码版本。
  - type: textarea
    id: evidence
    attributes:
      label: 截图或精简报错（可选）
      description: 截图请先遮挡个人信息；日志仅保留与问题相关的片段。
